name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore WaferInspect.slnx

      - name: 构建（TreatWarningsAsErrors，0 警告 0 错误）
        run: dotnet build WaferInspect.slnx -c Release --no-restore

      - name: 单元测试
        run: dotnet test WaferInspect.slnx -c Release --no-build --no-restore
